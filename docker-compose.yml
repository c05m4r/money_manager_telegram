services:
  telegram-bot:
    build: .
    container_name: money_manager_telegram
    restart: unless-stopped
    env_file: env/.env
    environment:
      DATABASE_PATH: /app/data/bot.sqlite
    extra_hosts:
      # Lets BACKEND_API_URL=http://host.docker.internal:8000/api/v1 reach a backend on the host.
      - "host.docker.internal:host-gateway"
    volumes:
      - bot_data:/app/data

volumes:
  bot_data:
